name: ai_remodeling
description: "A new Flutter project."

publish_to: 'none'


version: 4.0.4+5
environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  app_tracking_transparency: ^2.0.6+1
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^6.2.1
  image_picker: ^1.2.1
  camera: ^0.11.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.0
  share_plus: ^12.0.1
  image: ^4.5.4
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.1.0
  sign_in_with_apple: ^7.0.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  image_gallery_saver: ^2.0.3
  in_app_purchase: ^3.2.3
  connectivity_plus: ^7.0.0
  url_launcher: ^6.1.10
  http: ^1.1.0
  firebase_analytics: ^12.1.0
  fluttertoast: ^9.0.0
  video_player: ^2.8.1

  flutter_launcher_icons: ^0.14.4
  curved_navigation_bar: ^1.0.6
  shimmer: ^3.0.0
  firebase_database: ^12.3.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/kitchen/
    - assets/garden/
    - assets/icons/
    - assets/video/
    - assets/home_images/
    - assets/room_furnashing/
    - assets/images/logo.jpeg


